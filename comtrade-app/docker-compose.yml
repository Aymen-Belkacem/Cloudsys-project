# Local development only: ECS does not use this file.
# Usage: docker compose up --build   then   http://localhost:8501
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: local
    image: comtrade-app:local
    ports:
      - "8501:8501"
    environment:
      APP_ENV: local
      # DOCDB_URI: "mongodb://..."   # later, once step 1 exists
    # Mount the code to see changes without rebuilding (Streamlit hot reload)
    volumes:
      - ./app:/app
    command: ["streamlit", "run", "app.py", "--server.runOnSave=true"]
