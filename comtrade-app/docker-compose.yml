# Developpement local uniquement : ECS n'utilise pas ce fichier.
# Usage : docker compose up --build   puis   http://localhost:8501
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: local
    image: comtrade-app:local
    ports:
      - "8501:8501"
    environment:
      APP_ENV: local
      # DOCDB_URI: "mongodb://..."   # plus tard, quand l'etape 1 existera
    # Monte le code pour voir les modifications sans rebuild (Streamlit recharge a chaud)
    volumes:
      - ./app:/app
    command: ["streamlit", "run", "app.py", "--server.runOnSave=true"]
